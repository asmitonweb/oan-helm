name: Validate Helm charts
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@v5
        with:
          version: v3.19.0
      - run: python -m pip install -r requirements.txt
      - name: Verify URL migration preserves private routes and configuration
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Validate sources, locks, workload options and packaged repository
        # A chart changed without a version bump passes as "unreleased";
        # release.yaml versions and publishes it after merge.
        run: |
          python scripts/validate.py --package
          python scripts/validate_registry_addons.py --package
      - name: Retain validation evidence
        uses: actions/upload-artifact@v7
        with:
          name: helm-validation
          path: releases/validation.json
