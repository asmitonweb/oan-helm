analytics:
  image:
    repository: ''
    tag: ''
  bulkSample:
    enabled: false
    farmers: 100000
    expectedCountry: ''
  reportingViews:
    enabled: true
    generate: false
    refreshSchedule: 0 * * * *
    devOverlay:
      configMap: ''
      files:
      - generate_reporting_views.py
      - reporting_views.sql
      - reporting.yaml
    matchPrefix: fr_rpt_
  dashboards:
    enabled: true
    image:
      repository: apachesuperset.docker.scarf.sh/apache/superset
      tag: 4.0.1
    supersetAdmin: svc-importer
    supersetAdminPasswordSecret:
      generate: true
      name: openg2p-insights-superset-svc
      key: password
    supersetDatabaseName: FR
    superset:
      url: http://commons-services-superset.commons.svc.cluster.local:8088
      required: false
      waitAttempts: 60
      waitSeconds: 5
      envFromSecret: commons-services-superset-env
      dbPasswordSecret:
        name: superset-db-user
        key: superset-db-user-password
      configSecret: commons-services-superset-config
      configKey: superset_config.py
      bootstrapKey: superset_bootstrap.sh
      enableEmbedding: true
    bundleConfigMap: ''
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      memory: 2Gi
mapsContent:
  enabled: true
  nameOverride: ''
publicStaffUi:
  enabled: false
  replicas: 1
  env: {}
  volumes: []
  volumeMounts: []
  resources:
