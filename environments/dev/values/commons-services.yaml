  global:
    consentManagerHostname: consent-manager.development.oanstaging.com
    consentManagerPartnerHostname: consent-manager-partner.development.oanstaging.com
    consentManagerBeneHostname: ''
  consentManagerApi:
    envVars:
      CONSENT_MANAGER_AWE_CALLBACK_URL: http://{{ .Release.Name }}-cm-api.{{ .Release.Namespace }}.svc.cluster.local/consent/v1/awe/webhooks/decision
    istio:
      virtualservice:
        gateway: istio-system/development
  ui:
    istio:
      virtualservice:
        gateway: istio-system/development
keymanager:
  istio:
    virtualservice:
      gateway: istio-system/development
openg2p-awe:
  istio:
    virtualservice:
      gateway: istio-system/development
