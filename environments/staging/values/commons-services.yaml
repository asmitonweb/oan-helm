# Staging (oanstaging.com) overlay for a freshly rebuilt Commons. It is the New Dev
# overlay with the base domain changed; everything the chart enables by default
# (ODK Central with Keycloak OIDC client openg2p-odk, consent manager and partner
# portal, aggregation API, WebSub hub, eSignet mock, keymanager) stays on, as on
# New Dev. Hosts that the chart derives from global.baseDomain (aggregation API,
# consent partner portal, registry connector Keycloak clients) need the chart
# release that carries that derivation.
# Lines marked "staging: confirm" are not yet decided for staging.
global:
  baseDomain: oanstaging.com
  keycloakBaseUrl: https://keycloak.oanstaging.com
  keycloakInternalUrl: http://commons-keycloak.commons.svc.cluster.local:80
  keycloakExternalIssuerUrl: https://keycloak.oanstaging.com/realms/staff
  keycloakIssuerUrl: http://commons-keycloak.commons.svc.cluster.local:80/realms/staff
  iamHostname: staff-iam.oanstaging.com
  staffPortalApiHostname: staff-iam.oanstaging.com
  agentPortalApiHostname: agent-iam.oanstaging.com
  staffPortalHostname: staff-portal.oanstaging.com
  staffPortalCookieDomain: .oanstaging.com
  authCookieDomain: .oanstaging.com
  cookieDomain: .oanstaging.com
  iamUrl: https://staff-iam.oanstaging.com
  iamServiceUrl: http://commons-services-iam-staff-portal-api.commons.svc.cluster.local
  # Tile URL (see the chart's values.yaml); the API keeps master-data.*.
  masterDataHostname: master-data-ui.oanstaging.com
  masterDataUiHostname: master-data-ui.oanstaging.com
  masterDataApiUrl: http://commons-services-master-data-api.commons.svc.cluster.local
  aweHostname: awe.oanstaging.com
  aweBaseUrl: http://commons-services-awe.commons.svc.cluster.local
  odkHostname: odk-central.oanstaging.com
  supersetHostname: ''
  certifyHostname: ''
  agentPortalHostname: ''
superset:
  enabled: false
  istio:
    virtualservice:
      gateway: istio-system/staging
openg2p-inji-certify:
  enabled: false
  istio:
    virtualservice:
      gateway: istio-system/staging
master-data:
  global:
    masterDataHostname: master-data-ui.oanstaging.com
    masterDataUiHostname: master-data-ui.oanstaging.com
  # Geography cutover (10 Nov 2026): staging moves from the legacy catalogue (4 levels,
  # 21053 values with region-/zone-/woreda-/kebele- ids) to the ETH-OAN pack's geography
  # (5 levels, 21037 units, P-code ids), as on New Dev. The old master_data database is
  # renamed to master_data_archive_20261110 first, so this upgrade finds no database:
  # postgres-init creates it, the API creates the schema, and the geo-seed hook does a
  # first load of geography, code lists and the pack's sample people and publishes them.
  # Rehearsed on staging against a scratch database on 10 Nov: 1 published geography
  # version, 21037 units, 110 published lists, 21 people in 6 households.
  # geo is true ONLY for that first load. A follow-up change sets it back to false: on a
  # database that already has a published geography the load fails on the unique level
  # mnemonic and stops the upgrade at this hook.
  # samples: the pack's sample people (g2p_sample_individuals/households), which the
  # registries' sample loaders read from Master Data /samples. Staging only; the chart
  # default stays false. The load is an upsert (a re-run changes nothing).
  geoSeed:
    enabled: true
    publishInitial: true
    autoPublish: true
    load:
      geo: true
      codelists: true
      samples: true
  masterDataUi:
    iamPublicUrl: https://staff-iam.oanstaging.com
    envVars:
      COOKIE_DOMAIN: .oanstaging.com
    istio:
      virtualservice:
        gateway: istio-system/staging
  masterDataAPI:
    hostname: master-data.oanstaging.com
    istio:
      virtualservice:
        gateway: istio-system/staging
odk-central:
  backend:
    envVars:
      OIDC_ISSUER_URL: https://keycloak.oanstaging.com/realms/staff
  istio:
    virtualservice:
      gateway: istio-system/staging
esignet:
  hostname: esignet.oanstaging.com
  istio:
    virtualservice:
      gateway: istio-system/staging
  oidcUi:
    istio:
      virtualservice:
        gateway: istio-system/staging
mock-identity-system:
  hostname: esignet.oanstaging.com
  istio:
    virtualservice:
      gateway: istio-system/staging
openg2p-iam-service:
  global:
    keycloakApplicationUrl: https://keycloak.oanstaging.com
    registryApplicationUrl: https://farmer-registry.oanstaging.com
    minioApplicationUrl: https://minio-console.oanstaging.com
    supersetApplicationUrl: ''
    iamStaffUiApplicationUrl: https://iam-staff-ui.oanstaging.com
    masterDataApplicationUrl: https://master-data-ui.oanstaging.com
    aweApplicationUrl: https://awe.oanstaging.com
    staffPortalDefaultRedirectUri: https://staff-portal.oanstaging.com
    agentPortalDefaultRedirectUri: ''
  iamStaffUi:
    hostname: iam-staff-ui.oanstaging.com
    envVars:
      COOKIE_DOMAIN: .oanstaging.com
      BACKEND_API_URL: https://staff-iam.oanstaging.com
    istio:
      virtualservice:
        gateway: istio-system/staging
  iamStaffPortalApi:
    istio:
      virtualservice:
        gateway: istio-system/staging
  iamAgentPortalApi:
    istio:
      virtualservice:
        gateway: istio-system/staging
openg2p-staff-portal-ui:
  staffPortalUi:
    envVars:
      COOKIE_DOMAIN: .oanstaging.com
      IAM_URL: https://staff-iam.oanstaging.com
    istio:
      virtualservice:
        gateway: istio-system/staging
openg2p-audit-manager:
  global:
    auditManagerHostname: auditmanager.oanstaging.com
  auditManager:
    istio:
      virtualservice:
        gateway: istio-system/staging
partner-management:
  global:
    staffPortalUiHostname: partner-management.oanstaging.com
    partnerApiHostname: partner-management-partner-api.oanstaging.com
  staffPortalUi:
    envVars:
      IAM_URL: https://staff-iam.oanstaging.com
      KEYCLOAK_LOGOUT_URL: https://keycloak.oanstaging.com/realms/staff/protocol/openid-connect/logout
    istio:
      virtualservice:
        gateway: istio-system/staging
  staffPortalApi:
    istio:
      virtualservice:
        gateway: istio-system/staging
  partnerApi:
    istio:
      virtualservice:
        gateway: istio-system/staging
openg2p-consent-manager:
  # Equals the chart default; stated so a later default change cannot switch it off.
  enabled: true
  # extraApis is a list, so it is restated whole: only the gateway of cm-partner-api differs
  # from the chart default (istio-system/development does not exist on staging).
  extraApis:
  - enabled: true
    nameOverride: cm-partner-api
    apiAudience: partner
    authEnabled: 'false'
    signingKeyMounted: true
    hostname: '{{ tpl .Values.global.consentManagerPartnerHostname $ }}'
    openapiRootPath: /api/consent-manager-partner
    image:
      pullPolicy: Always
      registry: ''
      repository: 379220350808.dkr.ecr.ap-south-1.amazonaws.com/openg2p/commons/consent-manager-api
      tag: dev-48e64c249056@sha256:cca3273868b8ed28d193642b346fc3369b450ad7feefd42d02e91e84cb074831
    istio:
      enabled: true
      virtualservice:
        enabled: true
        host: '{{ tpl .Values.global.consentManagerPartnerHostname $ }}'
        gateway: istio-system/staging
        destination: '{{ .Release.Name }}-cm-partner-api'
        destinationPort: 80
        prefix: /api/consent-manager-partner/
        rewriteUri: /
      gateway:
        enabled: false
  - enabled: false
    nameOverride: cm-bene-api
    apiAudience: beneficiary
    authEnabled: 'true'
    signingKeyMounted: false
    hostname: '{{ tpl .Values.global.consentManagerBeneHostname $ }}'
    openapiRootPath: /api/consent-manager-bene
    istio:
      enabled: true
      virtualservice:
        enabled: true
        host: '{{ tpl .Values.global.consentManagerBeneHostname $ }}'
        gateway: istio-system/staging
        destination: '{{ .Release.Name }}-cm-bene-api'
        destinationPort: 80
        prefix: /api/consent-manager-bene/
        rewriteUri: /
      gateway:
        enabled: false
  global:
    consentManagerHostname: consent-manager.oanstaging.com
    consentManagerPartnerHostname: consent-manager-partner.oanstaging.com
    consentManagerBeneHostname: ''
  consentManagerApi:
    envVars:
      CONSENT_MANAGER_AWE_CALLBACK_URL: http://{{ .Release.Name }}-cm-api.{{ .Release.Namespace }}.svc.cluster.local/consent/v1/awe/webhooks/decision
    istio:
      virtualservice:
        gateway: istio-system/staging
  ui:
    istio:
      virtualservice:
        gateway: istio-system/staging
keymanager:
  istio:
    virtualservice:
      gateway: istio-system/staging
openg2p-awe:
  istio:
    virtualservice:
      gateway: istio-system/staging
# Services the Farmer registry, ODK intake and enrichment need. These equal the chart
# defaults; they are stated so a later default change cannot switch them off on staging.
websub:
  enabled: true
websubTopicProvisioning:
  enabled: true
aggregationApi:
  enabled: true
  virtualService:
    gateway: istio-system/staging
consentPartnerPortal:
  enabled: true
  virtualService:
    gateway: istio-system/staging

# IAM beneficiary portal API, as on New Dev. Login provider seeding stays off until a
# Fayda/eSignet client and signing key exist.
iamBenePortalApi:
  enabled: true
  virtualService:
    enabled: true
    host: bene-iam.oanstaging.com
    gateway: istio-system/staging
  loginProvider:
    seed: false
    defaultRedirectUri: https://bene-portal.oanstaging.com
