# Configuration of OpenG2P's Agri Stack install test (OpenG2P/agri-stack scripts/test_install.py) for registry-test,
# in OpenG2P's reference topology: the Exchange in agrix (*.agrix.test.oanstaging.com) and one department per registry,
# each with its own Commons and Partner Management (farmer, crop, livestock under *.<ns>.test.oanstaging.com).
#
#   git clone https://github.com/OpenG2P/agri-stack /opt/src/agri-stack
#   python3 -m venv /opt/agri-stack-test && /opt/agri-stack-test/bin/pip install -r /opt/src/agri-stack/scripts/requirements.txt
#   sudo -E /opt/agri-stack-test/bin/python /opt/src/agri-stack/scripts/test_install.py \
#     --config /opt/oan-helm/environments/test/agri-stack-test.yaml --dry-run      # then without --dry-run
#
# Credentials are read from the cluster with kubectl and never printed.
kube_context: ""

exchange:
  namespace: agrix
  domain: agrix.test.oanstaging.com
  composite:
    partner_id: agri-composite
  partner_management:
    client_id: commons-services-staff-portal
    client_secret:
      secret: commons-services-staff-portal
      key: client_secret
  partner_portal:
    enabled: true

# Each registry's department: its data controller ID and its install (namespace and domain), whose Partner
# Management gives the Composite its scope policy (OpenG2P install step 3).
registries:
  - controller: farmer-registry
    namespace: farmer
    domain: farmer.test.oanstaging.com
  - controller: cropsown-registry
    namespace: crop
    domain: crop.test.oanstaging.com
  - controller: livestock-registry
    namespace: livestock
    domain: livestock.test.oanstaging.com

test:
  partner: oan-test-bank
  use_case: farmer-profile
  # Sample farmer ETH-IND-0001 (Berhanu Abebe Assefa; openg2p-data packs/ETH-OAN/samples/individuals.json, synthetic),
  # registered by the Farmer registry's sample data loader. The Composite takes it as FAYDA_FAN (Master Data's
  # SUBJECT_ID_TYPE) and searches OAN's registries for it as DCI id type UIN.
  subject:
    type: FAYDA_FAN
    value: "502628318720"
  parameters: {}
  consent: sign
  subject_id_types: [FAYDA_FAN]
  auto_approve: true
  wait_seconds: 1800
  poll_seconds: 10
  state_dir: ""
  insecure_tls: false
