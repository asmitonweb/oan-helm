    repository: 379220350808.dkr.ecr.ap-south-1.amazonaws.com/eoan/farmer-registry/db-seed-1.2.2-rc.625
    tag: 1.0.0-develop.213@sha256:4512cc09b61e32fc6a3b93b9bdc0308d1b13fa389c0b21a6630b8979f7f68f49
  imagePullSecrets: []
  reportingViews:
    devOverlay:
      configMap: ''
      files:
      - generate_reporting_views.py
      - reporting_views.sql
      - reporting.yaml
    enabled: true
    generate: false
    masterData:
      apiUrl: '{{ .Values.global.masterDataApiUrl }}'
      clientId: '{{ .Values.global.authClientId }}'
      clientSecret:
        key: '{{ .Values.global.authClientSecretKey }}'
        name: '{{ .Values.global.authClientSecret }}'
      tokenUrl: '{{ .Values.global.masterDataTokenUrl }}'
    matchPrefix: fr_rpt_
    refreshSchedule: 0 * * * *
    waitForSchemaSeconds: 600
  resources:
    limits:
      memory: 2Gi
    requests:
      cpu: 200m
      memory: 256Mi
