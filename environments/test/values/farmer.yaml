# Test values for release farmer-registry in namespace farmer on registry-test (*.test.oanstaging.com): New Dev's computed
# values of that release (helm get values --all, 19 Nov 2026) with the domain and gateway changed and the object
# store moved to OpenG2P Commons' Garage (garage.test.oanstaging.com; its init job writes the MinIO-compatible
# commons-minio Secret). These charts bake New Dev's hosts into their defaults, so the full set is kept.
analytics:
  bulkSample:
    enabled: false
    expectedCountry: ''
    farmers: 100000
  dashboards:
    bundleConfigMap: ''
    enabled: false
    image:
      repository: apachesuperset.docker.scarf.sh/apache/superset
      tag: 4.0.1
    superset:
      bootstrapKey: superset_bootstrap.sh
      configKey: superset_config.py
      configSecret: commons-services-superset-config
      dbPasswordSecret:
        key: superset-db-user-password
        name: superset-db-user
      enableEmbedding: true
      envFromSecret: commons-services-superset-env
      required: false
      url: http://commons-services-superset.commons.svc.cluster.local:8088
      waitAttempts: 60
      waitSeconds: 5
    supersetAdmin: svc-importer
    supersetAdminPasswordSecret:
      generate: true
      key: password
      name: openg2p-insights-superset-svc
