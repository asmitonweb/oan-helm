# Test overlay for OpenG2P's openg2p-commons-services (release `commons-services`, pin ../commons-services.chart) on
# registry-test: the upstream chart, unmodified, in place of OAN's charts/openg2p-commons-services (whose OAN Consent
# Manager build and Aggregation API are dropped). Hosts derive from baseDomain.
global:
  baseDomain: test.oanstaging.com
  # OAN runs one Commons for the Exchange and every department, so the role-derived Composite onboarding (department
  # role only) never fires. Set the Composite's JWKS URL explicitly: Partner Management then onboards
  # PARTNER_AGRI_COMPOSITE at install (bootstrapPartners), as each department's PM does in OpenG2P's topology. The
  # role stays unset: the Composite runs with passthrough consent (values/agri-composite.yaml).
  agriStackExchange:
    compositeJwksUrl: https://agri-composite.test.oanstaging.com/.well-known/jwks.json
partner-management:
  staffPortalApi:
    # Policy requests for a use case are checked against the Composite's published use cases (OpenG2P's Exchange
    # setting). Registry scope catalogues are not listed: they need each registry's unsigned catalogue read, so scope
    # policies stay free text here.
    catalogueSources:
      - kind: use_cases
        url: http://agri-composite-api/composite/v1/use-cases
        label: Agri Stack Composite
