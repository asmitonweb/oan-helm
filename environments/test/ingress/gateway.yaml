# Istio Gateways of the test environment (registry-test). Host nginx terminates TLS for *.test.oanstaging.com
# (wildcard certificate in /etc/openg2p/certs/test-wildcard.oanstaging.com) and proxies to the ingress gateway
# NodePort 30080, as on New Dev (nginx.conf). istio-system/test is the gateway the overlays name; commons/internal
# is the per-namespace default the charts use when no gateway is set. Registry namespaces get the same `internal`.
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: test
  namespace: istio-system
spec:
  selector:
    istio: ingressgateway
  servers:
  - hosts:
    - '*.test.oanstaging.com'
    port:
      name: test-http
      number: 8080
      protocol: HTTP
---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: internal
  namespace: commons
spec:
  selector:
    istio: ingressgateway
  servers:
  - hosts:
    - '*.test.oanstaging.com'
    port:
      name: http
      number: 8080
      protocol: HTTP
