# Host nginx on registry-test: /etc/nginx/sites-enabled/oan-test-wildcard.conf.
# Certificate: acme.sh, Let's Encrypt, Route 53 DNS-01, for test.oanstaging.com and *.test.oanstaging.com
# (one certificate for test.oanstaging.com and the wildcards *.test, *.farmer.test, *.crop.test, *.livestock.test
# and *.agrix.test, one per organisation; a new host needs no certificate change).
upstream istio_ingress { server 10.0.1.116:30080; }
server {
    listen 80;
    server_name test.oanstaging.com *.test.oanstaging.com *.farmer.test.oanstaging.com *.crop.test.oanstaging.com *.livestock.test.oanstaging.com *.agrix.test.oanstaging.com;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name test.oanstaging.com *.test.oanstaging.com *.farmer.test.oanstaging.com *.crop.test.oanstaging.com *.livestock.test.oanstaging.com *.agrix.test.oanstaging.com;
    ssl_certificate /etc/openg2p/certs/test-wildcard.oanstaging.com/fullchain.pem;
    ssl_certificate_key /etc/openg2p/certs/test-wildcard.oanstaging.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100m;
    large_client_header_buffers 8 64k;
    proxy_buffer_size 128k;
    proxy_buffers 8 128k;
    location / {
        proxy_pass http://istio_ingress;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
